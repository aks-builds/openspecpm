name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm install

      - name: Run tests and capture output
        id: tests
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.txt
          count=$(grep -oE '^ℹ tests [0-9]+' test-output.txt | tail -1 | grep -oE '[0-9]+' || echo 0)
          fail=$(grep -oE '^ℹ fail [0-9]+'  test-output.txt | tail -1 | grep -oE '[0-9]+' || echo 0)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "fail=$fail"   >> "$GITHUB_OUTPUT"
          echo "Tests: $count passing, $fail failing"

      - name: Update test-count badge JSON
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.tests.outputs.fail == '0'
        env:
          COUNT: ${{ steps.tests.outputs.count }}
        run: |
          mkdir -p .github/badges
          color=brightgreen
          [ "$COUNT" -lt 50 ]  && color=yellow
          [ "$COUNT" -lt 10 ]  && color=red
          cat > .github/badges/tests.json <<EOF
          {
            "schemaVersion": 1,
            "label": "tests",
            "message": "$COUNT passing",
            "color": "$color",
            "cacheSeconds": 300
          }
          EOF

          if git diff --quiet .github/badges/tests.json; then
            echo "Badge already up-to-date ($COUNT passing) — no commit."
            exit 0
          fi

          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/badges/tests.json
          git commit -m "chore: bump tests badge to $COUNT passing"
          git push
