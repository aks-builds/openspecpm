name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm install

      - name: Run tests and capture output
        id: tests
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.txt
          # node --test uses 'spec' reporter on TTY (prefix ℹ) and 'tap' on CI (prefix #).
          count=$(grep -oE '^[ℹ#] tests [0-9]+' test-output.txt | tail -1 | grep -oE '[0-9]+' || echo 0)
          fail=$(grep -oE '^[ℹ#] fail [0-9]+'  test-output.txt | tail -1 | grep -oE '[0-9]+' || echo 0)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "fail=$fail"   >> "$GITHUB_OUTPUT"
          echo "Tests: $count passing, $fail failing"

      - name: Pick badge color
        id: color
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.tests.outputs.fail == '0'
        env:
          COUNT: ${{ steps.tests.outputs.count }}
        run: |
          color=brightgreen
          [ "$COUNT" -lt 50 ] && color=yellow
          [ "$COUNT" -lt 10 ] && color=red
          echo "color=$color" >> "$GITHUB_OUTPUT"

      - name: Update tests-count badge gist
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.tests.outputs.fail == '0'
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: ${{ vars.TESTS_BADGE_GIST_ID }}
          filename: tests.json
          label: tests
          message: ${{ steps.tests.outputs.count }} passing
          color: ${{ steps.color.outputs.color }}
          cacheSeconds: 300
